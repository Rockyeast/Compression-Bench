schema_version = "1.4"
# Submission is a persistent host bind mount, not a Harbor download/upload.
artifacts = []

[task]
name = "quantization-bench/quantize-qwen3.8-27b-12g"
version = "0.13.0"
description = "Compress Qwen3.8-27B to 12 GiB; minimize quality-penalized PPL times decode latency on the allocated GPU."
keywords = ["quantization", "llm", "qwen", "fp8"]

[metadata]
modality_policy = "preserve-nontext-unchanged-v1"
reference_modality_validation = "old-recipe-exceeds-capacity-with-restored-vision"
storage_protocol = "single-copy-locked-v1"
model = "Qwen/Qwen3.8-27B"
model_revision = "1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0"
size_limit_gib = 12
scoring_protocol = "ppl-latency-product-c4-bf16-gray15-cap20-v4"
ppl_protocol = "c4-gptq-256x2048-v1"
ppl_baseline_status = "measured_new_protocol"
decode_protocol = "submitted-decode-single-token-3x3-v3"
decode_workload_split = "public-hidden-v1"
decode_hidden_calibration = "complete"
inference_protocol = "submitted-inference-audited-v1"
review_required = true
score_status = "provisional"
reference_validation = "unavailable-capacity-exceeded-under-preserve-nontext-policy"

[verifier]
timeout_sec = 3600.0

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 3600.0

[agent]
timeout_sec = 28800.0
network_mode = "allowlist"
allowed_hosts = []

[environment]
network_mode = "public"
build_timeout_sec = 3600.0
