services:
  main:
    command: ["python3", "/app/submission_guard.py", "hold"]
    healthcheck:
      test: ["CMD", "python3", "/app/submission_guard.py", "ready"]
      interval: 2s
      timeout: 2s
      retries: 30
    user: "${QUANT_BENCH_HOST_UID:?set by run.sh}:${QUANT_BENCH_HOST_GID:?set by run.sh}"
    environment:
      HOME: /app/work/.agent-home
      XDG_CACHE_HOME: /app/work/.agent-home/.cache
      UV_CACHE_DIR: /app/work/.agent-home/.cache/uv
      UV_PYTHON_INSTALL_DIR: /app/work/.agent-home/.local/share/uv/python
      UV_TOOL_DIR: /app/work/.agent-home/.local/share/uv/tools
      UV_TOOL_BIN_DIR: /app/work/.agent-home/.local/bin
      XDG_CONFIG_HOME: /app/work/.agent-home/.config
    depends_on:
      public-checker:
        condition: service_healthy
    volumes:
      - type: bind
        source: "${QUANT_BENCH_RUN_DIR:?set by run.sh}/.submission.lock"
        target: /run/quantization-bench-submission.lock
        read_only: true
      - type: bind
        source: "${QUANT_BENCH_MODEL_DIR:?set QUANT_BENCH_MODEL_DIR to the pinned BF16 checkpoint directory}"
        target: /input/model
        read_only: true
      - type: bind
        source: "${QUANT_BENCH_RUN_DIR:?set by run.sh to jobs/run-id}/work"
        target: /app/work
      - type: bind
        source: "${QUANT_BENCH_RUN_DIR:?set by run.sh to jobs/run-id}/submission"
        target: /app/submission
      - type: volume
        source: checker-socket
        target: /run/quantization-bench
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - "${QUANT_BENCH_GPU_DEVICE:?set QUANT_BENCH_GPU_DEVICE to an idle GPU index}"
              capabilities:
                - gpu

  public-checker:
    cpus: 8.0
    mem_limit: 128g
    build:
      context: ./public-checker
    command:
      - --socket
      - /run/quantization-bench/checker.sock
      - --submission
      - /submission
      - --evaluator
      - /checker/evaluate_public.py
      - --evaluation-timeout
      - "1200"
    network_mode: none
    volumes:
      - type: bind
        source: "${QUANT_BENCH_MODEL_DIR:?set QUANT_BENCH_MODEL_DIR to the pinned BF16 checkpoint directory}"
        target: /input/model
        read_only: true
      - type: bind
        source: "${QUANT_BENCH_RUN_DIR:?set by run.sh to jobs/run-id}/submission"
        target: /submission
        read_only: true
      - type: volume
        source: checker-socket
        target: /run/quantization-bench
    shm_size: 16gb
    healthcheck:
      test:
        - CMD-SHELL
        - test -S /run/quantization-bench/checker.sock
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - "${QUANT_BENCH_GPU_DEVICE:?set QUANT_BENCH_GPU_DEVICE to an idle GPU index}"
              capabilities:
                - gpu


volumes:
  checker-socket:
