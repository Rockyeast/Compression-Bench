# Loaded by the launcher only when a real optional debug model is provided.
services:
  main:
    volumes:
      - type: bind
        source: "${QUANT_BENCH_DEBUG_MODEL_DIR:?debug model must be enabled}"
        target: /input/debug-model
        read_only: true
      - type: bind
        source: "${QUANT_BENCH_RUN_DIR:?set by run.sh}/work/debug-submission"
        target: /app/debug-submission
  public-checker:
    volumes:
      - type: bind
        source: "${QUANT_BENCH_DEBUG_MODEL_DIR:?debug model must be enabled}"
        target: /input/debug-model
        read_only: true
      - type: bind
        source: "${QUANT_BENCH_RUN_DIR:?set by run.sh}/work/debug-submission"
        target: /debug-submission
        read_only: true
